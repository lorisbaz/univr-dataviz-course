name: data-viz-2025
channels:
  - defaults
  - conda-forge
dependencies:
  - jupyterlab
  - python=3.10
  - pandas=2.3.2
  - matplotlib=3.10.6
  - plotly=6.3.0
  - seaborn=0.13.2
  - scikit-learn
  - folium
  - geopandas
  - fiona
  - pydicom
  - opencv
  - scikit-image
  - pyvista
  - wordcloud
  - dash
  - pip:
      - nxviz
prefix: /opt/miniconda3/envs/data-viz-2025
